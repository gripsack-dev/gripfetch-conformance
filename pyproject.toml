[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gripfetch-conformance"
version = "0.1.0"
description = "Protocol conformance suite for gripfetch-* transport plugins (gripsack plan/0002 §4, 0009 §2)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
urls = { Repository = "https://github.com/gripsack-dev/gripfetch-conformance" }

[project.scripts]
gripfetch-conformance = "gripfetch_conformance.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gripfetch_conformance"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
